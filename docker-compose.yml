---
services:
  backend:
    build: .
    ports:
      - "8087:5000"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - FLASK_APP=main.py
      # Use same credential path pattern as production (project root = /app in container)
      - GOOGLE_APPLICATION_CREDENTIALS=/app/service-account.json
      # Mail config from .env (MAIL_BACKEND=mailcatcher | google, MAIL_USERNAME, MAIL_PASSWORD)
    depends_on:
      - mailcatcher

  mailcatcher:
    image: sj26/mailcatcher:v0.10.0
    ports:
      - "1025:1025"  # SMTP port
      - "1088:1080"  # Web interface
